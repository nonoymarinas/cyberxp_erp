
<!-- ========================================
     Menu History SVG
     ======================================== -->

<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 24 24"

  class="cxp-icon-menu-history"

  [class.cxp-icon-menu-history--xs]="size === 'xs'"
  [class.cxp-icon-menu-history--sm]="size === 'sm'"
  [class.cxp-icon-menu-history--md]="size === 'md'"
  [class.cxp-icon-menu-history--lg]="size === 'lg'"
  [class.cxp-icon-menu-history--xl]="size === 'xl'"

  [class.cxp-icon-menu-history--filled]="fill === 'filled'"

  [attr.stroke]="color"
  [attr.stroke-width]="effectiveStrokeWidth"

  stroke-linecap="round"
  stroke-linejoin="round"

  fill="none"
  aria-hidden="true"
>

  <!-- ======================================
       History Arrow / Clock Outline
       ====================================== -->

  <path
    d="M3 11a9 9 0 1 1 2.6 6.4"
  />

  <path
    d="M3 4v7h7"
  />

  <!-- ======================================
       Clock Hands
       ====================================== -->

  <path
    d="M12 7v5l3.5 2"
  />

  <!-- ======================================
       Filled Mode Accent
       ====================================== -->

  @if (fill === 'filled') {
    <circle
      cx="12"
      cy="12"
      r="1.3"
      [attr.fill]="color"
      stroke="none"
    />
  }

</svg>
