<div
  class="display-field"
  [class.display-field--sm]="size === 'sm'"
  [class.display-field--md]="size === 'md'"
  [class.display-field--lg]="size === 'lg'"
  [class.display-field--xl]="size === 'xl'"
  [class.display-field--disabled]="disabled"
  [class.display-field--invalid]="invalid"
>
  <span class="display-field__prefix">
    <ng-content select="[prefix]"></ng-content>
  </span>

  <span
    class="display-field__value"
    [attr.aria-invalid]="invalid ? 'true' : null"
  >
    @if (value !== null && value !== undefined && value !== '') {
      {{ value }}
    } @else {
      <ng-content></ng-content>
    }
  </span>

  <span class="display-field__suffix">
    <ng-content select="[suffix]"></ng-content>
  </span>
</div>
