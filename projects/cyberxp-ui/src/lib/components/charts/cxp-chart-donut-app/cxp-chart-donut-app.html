<section
  class="employees-summary"
  [attr.aria-label]="title"
>
  <h2 class="employees-summary__title">
    {{ title }}
  </h2>

  <div class="employees-summary__content">
    <div
      #chartContainer
      class="employees-summary__chart"
      echarts
      [options]="chartOptions"
      [autoResize]="true"
      (chartInit)="onChartInit($event)"
      role="img"
      [attr.aria-label]="title + ' donut chart'"
    ></div>

    <div
      class="employees-summary__legend"
      aria-label="Employee categories"
    >
      @for (employee of employees; track employee.code) {
        <div class="employees-summary__legend-item">
          <span
            class="employees-summary__legend-color"
            [style.background-color]="employee.color"
            aria-hidden="true"
          ></span>

          <span class="employees-summary__legend-label">
            {{ employee.code }} - {{ employee.label }}
          </span>

          <span class="employees-summary__legend-value">
            {{ employee.value }}
          </span>
        </div>
      }
    </div>
  </div>
</section>
