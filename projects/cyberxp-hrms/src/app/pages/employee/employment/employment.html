<section>
  <div class="cxp-section">
    <header class="item-group-header">
      <cxp-icon-address-nav class="sub-header-icon" size="xs" fill="outline"></cxp-icon-address-nav>
      <h3 class="cxp-section__title">Employment Details</h3>
      <div class="employment__actions">
        @if (isEditing) {
          <cxp-button size="sm" variant="secondary" (clicked)="cancelEdit()"> Cancel </cxp-button>

          <cxp-button size="sm" variant="primary" (clicked)="saveEmployment()"> Save </cxp-button>
        } @else {
          <cxp-button size="sm" variant="secondary" (clicked)="startEdit()"> Edit </cxp-button>
        }
      </div>
    </header>

    <div class="item-group-box">
      @if (isEditing) {
        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Department </label>

          <cxp-input-select
            size="sm"
            placeholder="Department"
            [(value)]="employment.department"
          ></cxp-input-select>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Position </label>

          <cxp-input-select
            size="sm"
            placeholder="Position"
            [(value)]="employment.position"
          ></cxp-input-select>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Employment Type </label>

          <cxp-input-select
            size="sm"
            placeholder="Employment Type"
            [(value)]="employment.employmentType"
          ></cxp-input-select>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Employment Status </label>

          <cxp-input-select
            size="sm"
            placeholder="Employment Status"
            [(value)]="employment.employmentStatus"
          ></cxp-input-select>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Date Hired </label>

          <cxp-input-text
            size="sm"
            placeholder="Date Hired"
            [(value)]="employment.dateHired"
          ></cxp-input-text>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Work Location </label>

          <cxp-input-select
            size="sm"
            placeholder="Work Location"
            [(value)]="employment.workLocation"
          ></cxp-input-select>
        </div>
      } @else {
        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Department </label>

          <cxp-display-field size="sm" [value]="employment.department"></cxp-display-field>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Position </label>

          <cxp-display-field size="sm" [value]="employment.position"></cxp-display-field>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Employment Type </label>

          <cxp-display-field size="sm" [value]="employment.employmentType"></cxp-display-field>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Employment Status </label>

          <cxp-display-field size="sm" [value]="employment.employmentStatus"></cxp-display-field>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Date Hired </label>

          <cxp-display-field size="sm" [value]="employment.dateHired"></cxp-display-field>
        </div>

        <div class="cxp-input__wrap">
          <label class="cxp-label cxp-label-bg cxp-label-sm"> Work Location </label>

          <cxp-display-field size="sm" [value]="employment.workLocation"></cxp-display-field>
        </div>
      }
    </div>
  </div>
</section>
