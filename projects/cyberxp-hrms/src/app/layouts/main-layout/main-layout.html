
<cxp-layout-main
  [(sidebarOpen)]="sidebarOpen"
  [(sidebarWidth)]="sidebarWidth"
>
  <!-- ========================================
       Header
       ======================================== -->

  <div layout-header class="main-layout__header">

    <cxp-icon-app-nav
      class="cyberxp-logo"
      size="xs"
      fill="filled"
    ></cxp-icon-app-nav>

    <label class="module-name cxp-title cxp-title-md">
      CXP-HRMS
      <span class="module-name-span">
        - Human Resource Management System
      </span>
      v.10.1.0
    </label>

    <header-apps-icon
      class="header-apps-icon"
    ></header-apps-icon>

    <header-user-icon
      class="header-apps-icon"
    ></header-user-icon>

  </div>

  <!-- ========================================
       Sidebar
       ======================================== -->

  <aside
    layout-sidebar
    class="main-layout__body__sidebar cxp-sidebar"
    [class.main-layout__body__sidebar--open]="sidebarOpen"
  >

    <!-- ======================================
         Company Logo
         ====================================== -->

    <div class="sidebar__header cxp-sidebar__header">
      <img
        class="company-logo-img"
        src="/assets/images/icons/spx-logo.png"
        alt="SPX Logo"
      />
    </div>

    <!-- ======================================
         Navigation
         ====================================== -->

    <nav
      class="sidebar__menu"
      aria-label="HRMS navigation"
    >

      <!-- ====================================
           Dashboard
           ==================================== -->

      <cxp-menu-sidebar-item
        route="/app/dashboard"
        [exact]="true"
      >
        <cxp-icon-menu-dashboard
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-menu-dashboard>

        <span label>Dashboard</span>
      </cxp-menu-sidebar-item>

      <!-- ====================================
           Home
           ==================================== -->

      <cxp-menu-sidebar-item
        route="/app/home"
        [exact]="true"
      >
        <cxp-icon-menu-home
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-menu-home>

        <span label>Home</span>
      </cxp-menu-sidebar-item>

      <!-- ====================================
           Employees
           ==================================== -->

      <cxp-menu-sidebar-item
        [group]="true"
        [expanded]="false"
        ariaLabel="Employees"
      >

        <cxp-icon-menu-employees
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-menu-employees>

        <span label>Employees</span>

        <!-- Employee Records -->

        <cxp-menu-sidebar-item
          route="/app/employee-list"
          [exact]="true"
        >
          <cxp-icon-menu-records
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-records>

          <span label>Records</span>
        </cxp-menu-sidebar-item>

        <!-- Employee History -->

        <cxp-menu-sidebar-item
          route="/app/employees/history"
        >
          <cxp-icon-menu-history
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-history>

          <span label>History</span>
        </cxp-menu-sidebar-item>

      </cxp-menu-sidebar-item>
      <!-- End Employees -->

      <!-- ====================================
           Hiring
           ==================================== -->

      <cxp-menu-sidebar-item
        [group]="true"
        [expanded]="false"
        ariaLabel="Hiring"
      >

        <cxp-icon-human-plus
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-human-plus>

        <span label>Hiring</span>

        <!-- Hire New -->

        @if (
          userAccessService.hasPermission(
            'hrms.employee.personal.create'
          )
        ) {
          <cxp-menu-sidebar-item
            route="/app/new-employee/personal-info"
          >
            <cxp-icon-human-new
              start
              size="sm"
              fill="outline"
              [strokeWidth]="1.5"
            ></cxp-icon-human-new>

            <span label>Hire New</span>
          </cxp-menu-sidebar-item>
        }

        <!-- Hiring History -->

        <cxp-menu-sidebar-item
          route="/app/hiring/history"
        >
          <cxp-icon-menu-history
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-history>

          <span label>History</span>
        </cxp-menu-sidebar-item>

      </cxp-menu-sidebar-item>
      <!-- End Hiring -->

      <!-- ====================================
           Rehiring
           ==================================== -->

      <cxp-menu-sidebar-item
        [group]="true"
        [expanded]="false"
        ariaLabel="Rehiring"
      >

        <cxp-icon-menu-rehire
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-menu-rehire>

        <span label>Rehiring</span>

        <!-- Rehire -->

        <cxp-menu-sidebar-item
          route="/app/rehiring"
          [exact]="true"
        >
          <cxp-icon-menu-rehire
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-rehire>

          <span label>Rehire</span>
        </cxp-menu-sidebar-item>

        <!-- Rehiring History -->

        <cxp-menu-sidebar-item
          route="/app/rehiring/history"
        >
          <cxp-icon-menu-history
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-history>

          <span label>History</span>
        </cxp-menu-sidebar-item>

      </cxp-menu-sidebar-item>
      <!-- End Rehiring -->

      <!-- ====================================
           Reactivation
           ==================================== -->

      <cxp-menu-sidebar-item
        [group]="true"
        [expanded]="false"
        ariaLabel="Reactivation"
      >

        <cxp-icon-menu-reactivation
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-menu-reactivation>

        <span label>Reactivation</span>

        <!-- Reactivate -->

        <cxp-menu-sidebar-item
          route="/app/reactivation"
          [exact]="true"
        >
          <cxp-icon-menu-reactivation
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-reactivation>

          <span label>Reactivate</span>
        </cxp-menu-sidebar-item>

        <!-- Reactivation History -->

        <cxp-menu-sidebar-item
          route="/app/reactivation/history"
        >
          <cxp-icon-menu-history
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-history>

          <span label>History</span>
        </cxp-menu-sidebar-item>

      </cxp-menu-sidebar-item>
      <!-- End Reactivation -->

      <!-- ====================================
           Approvals
           ==================================== -->

      <cxp-menu-sidebar-item
        [group]="true"
        [expanded]="false"
        ariaLabel="Approvals"
      >

        <cxp-icon-menu-pending
          start
          size="md"
          fill="outline"
          [strokeWidth]="1.5"
        ></cxp-icon-menu-pending>

        <span label>Approvals</span>

        <!-- Pending Approvals -->

        <cxp-menu-sidebar-item
          route="/app/approvals/pending"
        >
          <cxp-icon-menu-pending
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-pending>

          <span label>Pending</span>
        </cxp-menu-sidebar-item>

        <!-- Approval History -->

        <cxp-menu-sidebar-item
          route="/app/approvals/history"
        >
          <cxp-icon-menu-history
            start
            size="sm"
            fill="outline"
            [strokeWidth]="1.5"
          ></cxp-icon-menu-history>

          <span label>History</span>
        </cxp-menu-sidebar-item>

      </cxp-menu-sidebar-item>
      <!-- End Approvals -->

    </nav>

    <!-- ======================================
         Sidebar Footer
         ====================================== -->

    <div class="sidebar__footer">

      <!-- Settings -->

      <cxp-menu-sidebar-item
        route="/app/settings"
      >
        <cxp-icon-settings-nav
          start
          size="xs"
          fill="outline"
        ></cxp-icon-settings-nav>

        <span label>Settings</span>
      </cxp-menu-sidebar-item>

      <!-- Logout -->

      <cxp-menu-sidebar-item
        route="/app/logouts"
      >
        <cxp-icon-logout-nav
          start
          size="xs"
          fill="outline"
        ></cxp-icon-logout-nav>

        <span label>Logout</span>
      </cxp-menu-sidebar-item>

    </div>

  </aside>

  <!-- ========================================
       Footer
       ======================================== -->

  <div layout-footer>
    <label class="main-layout__footer__notes">
      © 2026 CyberXP ERP. All rights reserved.
    </label>
  </div>

</cxp-layout-main>

<!-- ========================================
     Chatbot
     ======================================== -->

<cxp-chatbot-main />
