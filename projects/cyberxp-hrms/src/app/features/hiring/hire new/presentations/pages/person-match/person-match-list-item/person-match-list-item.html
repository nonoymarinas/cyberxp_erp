
<!-- ========================================
     Person Match List Item
     ======================================== -->

<button
  type="button"
  class="match-item"
  (click)="selectPerson()"
  [attr.aria-label]="
    'View person record: ' +
    fullName() +
    '. ' +
    decisionLabel()
  "
>

  <!-- ========================================
       Avatar
       ======================================== -->

  <div class="match-avatar">

    @if (person().imageUrl) {

      <img
        class="match-avatar-image"
        [src]="person().imageUrl"
        [alt]="fullName()"
        loading="lazy"
      />

    } @else {

      <span aria-hidden="true">
        {{ initials() }}
      </span>

    }

  </div>

  <!-- ========================================
       Person Information
       ======================================== -->

  <div class="match-details">

    <!-- Full Name -->

    <span class="match-person-name">
      {{ fullName() }}
    </span>

    <!-- Person Number -->

    <span class="match-person-number">
      {{ person().personNumber }}
    </span>

    <!-- Date of Birth -->

    <span class="match-person-dob">
      Date of Birth:
      {{ person().dateOfBirth }}
    </span>

    <!-- ======================================
         Match Level
         ====================================== -->

    @if (badgeClassification(); as level) {

      <cxp-classification-badge
        [classification]="level"
        [label]="matchLevelLabel()"
      />

    } @else {

      <span class="match-classification-unavailable">
        {{ matchLevelLabel() }}
      </span>

    }

    <!-- ======================================
         Match Method
         ====================================== -->

    <span class="match-person-method">
      Match Method:
      {{ matchMethod() }}
    </span>

    <!-- ======================================
         Decision Status
         ====================================== -->

    <span
      class="match-decision-status"
      [class.match-decision-status--pending]="isPendingReview()"
      [class.match-decision-status--confirmed]="decisionCode() === 'SAME_PERSON'"
      [class.match-decision-status--different]="decisionCode() === 'DIFFERENT_PERSON'"
      [class.match-decision-status--escalated]="decisionCode() === 'ESCALATE'"
    >
      {{ decisionLabel() }}
    </span>

  </div>

  <!-- ========================================
       Similarity Score
       ======================================== -->

  <div class="match-score">

    <span class="match-score-value">
      {{ matchScore() }}%
    </span>

    <span class="match-score-label">
      Similarity
    </span>

  </div>

  <!-- ========================================
       Navigation Arrow
       ======================================== -->

  <span
    class="match-arrow"
    aria-hidden="true"
  >
    ›
  </span>

</button>
