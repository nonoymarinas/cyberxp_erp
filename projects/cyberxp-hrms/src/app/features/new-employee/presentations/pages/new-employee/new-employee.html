<section class="cxp-page">

  <header class="cxp-section__header">
    <h2 class="cxp-section__title">
      Employee Details
    </h2>
  </header>


  <div class="new-employee-main-body">

    <!-- ========================================
         Step Navigation
         ======================================== -->

    <div class="sub-sidebar-box">

      @if (canCreatePersonalInfo) {

        <cxp-menu-page-item
          class="sub-sidebar-menu-item"
          route="personal-info"
        >
          <span label>
            Personals
          </span>

          <cxp-icon-chevron-app end>
          </cxp-icon-chevron-app>
        </cxp-menu-page-item>

      }


      @if (canCreateAddress) {

        <cxp-menu-page-item
          class="sub-sidebar-menu-item"
          route="address"
        >
          <span label>
            Addresses
          </span>

          <cxp-icon-chevron-app end>
          </cxp-icon-chevron-app>
        </cxp-menu-page-item>

      }


      @if (canCreateContact) {

        <cxp-menu-page-item
          class="sub-sidebar-menu-item"
          route="contacts"
        >
          <span label>
            Contacts
          </span>

          <cxp-icon-chevron-app end>
          </cxp-icon-chevron-app>
        </cxp-menu-page-item>

      }


      @if (canCreateEmergencyContact) {

        <cxp-menu-page-item
          class="sub-sidebar-menu-item"
          route="emergency"
        >
          <span label>
            Emergencies
          </span>

          <cxp-icon-chevron-app end>
          </cxp-icon-chevron-app>
        </cxp-menu-page-item>

      }


      @if (canCreateEmployment) {

        <cxp-menu-page-item
          class="sub-sidebar-menu-item"
          route="employment"
        >
          <span label>
            Employments
          </span>

          <cxp-icon-chevron-app end>
          </cxp-icon-chevron-app>
        </cxp-menu-page-item>

      }

    </div>


    <!-- ========================================
         Current Step
         ======================================== -->

    <div class="route-content">
      <router-outlet></router-outlet>
    </div>


    <!-- ========================================
         Wizard Navigation
         ======================================== -->

    <div class="cxp-section__footer">

      <cxp-button
        size="sm"
        variant="secondary"
        [disabled]="!canPrevious"
        (clicked)="previous()"
      >
        Previous
      </cxp-button>


      <cxp-button
        size="sm"
        variant="secondary"
        [disabled]="!canNext"
        (clicked)="next()"
      >
        Next
      </cxp-button>

    </div>

  </div>

</section>
